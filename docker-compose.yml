services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyvault-backend
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: studyvault-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt-data:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  certbot-webroot:
    external: true
    name: studyvault_certbot-webroot
  letsencrypt-data:
    external: true
    name: studyvault_letsencrypt-data
