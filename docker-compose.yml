services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyvault-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://3.106.220.253:5000
    container_name: studyvault-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
